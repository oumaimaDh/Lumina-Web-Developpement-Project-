<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

 <!-- Toggle Button -->
 <button class="toggle-btn" onclick="toggleSidebar()">☰</button>

 <!-- Sidebar -->
 <div class="sidebar" id="sidebar">
     <a href="homepage.html"  ><i class="fas fa-home"></i> Home</a>
     <a href="Manage.html"><i class="fas fa-users"></i> Users</a>
     <a href="Charts.html"><i class="fas fa-chart-bar"></i> Reports</a>

     <!-- Dropdown -->
     <div class="dropdown">
         <a class="dropdown-btn"  class="active"><i class="fas fa-building"></i> Departments</a>
         <div class="dropdown-container">
             <a href="Requests.html" ><i class="fas fa-handshake"></i> Associations</a>
             <a href="Jobs.html" ><i class="fas fa-briefcase"></i> Jobs</a>
             <a href="#"><i class="fas fa-calendar-alt"></i> Events</a>
             <a href="#" ><i class="fas fa-comments"></i> Reviews & Complaints</a>
         </div>
     </div>

     <a href="Admin.html" ><i class="fas fa-user-cog"></i> Profile Settings</a>
 </div>


 <div class="main-content">
     <h1>Manage Users</h1>

     <!-- Search Bar -->
     <div class="search-container">
         <div class="search-box">
             <i class="fas fa-search"></i>
             <input type="text" id="searchInput" placeholder="Search users by name, email, or role...">
         </div>
     </div>

     <!-- Users Table -->
     <div class="table-container">
         <table id="usersTable">
             <thead>
                 <tr>
                     <th>ID</th>
                     <th>Username</th>
                     <th>Email</th>
                     <th>Role</th>
                     <th>Status</th>
                     <th>Actions</th>
                 </tr>
             </thead>
             <tbody>
                 <tr>
                     <td>1</td>
                     <td>JohnDoe</td>
                     <td>john@example.com</td>
                     <td>Help Seeker</td>
                     <td><span class="status active">Active</span></td>
                     <td>
                         <div class="action-buttons">
                             <button class="btn btn-edit" onclick="editUser(1)"><i class="fas fa-edit"></i></button>
                             <button class="btn btn-delete" onclick="deleteUser(1)"><i class="fas fa-trash"></i></button>
                             <button class="btn btn-block" onclick="toggleBlockUser(1)"><i class="fas fa-ban"></i></button>
                         </div>
                     </td>
                 </tr>
                 <tr>
                     <td>2</td>
                     <td>JaneSmith</td>
                     <td>jane@example.com</td>
                     <td>Volunteer</td>
                     <td><span class="status active">Active</span></td>
                     <td>
                         <div class="action-buttons">
                             <button class="btn btn-edit" onclick="editUser(2)"><i class="fas fa-edit"></i></button>
                             <button class="btn btn-delete" onclick="deleteUser(2)"><i class="fas fa-trash"></i></button>
                             <button class="btn btn-block" onclick="toggleBlockUser(2)"><i class="fas fa-ban"></i></button>
                         </div>
                     </td>
                 </tr>
                 <tr>
                     <td>3</td>
                     <td>RobertJohnson</td>
                     <td>robert@example.com</td>
                     <td>Association</td>
                     <td><span class="status blocked">Blocked</span></td>
                     <td>
                         <div class="action-buttons">
                             <button class="btn btn-edit" onclick="editUser(3)"><i class="fas fa-edit"></i></button>
                             <button class="btn btn-delete" onclick="deleteUser(3)"><i class="fas fa-trash"></i></button>
                             <button class="btn btn-block" onclick="toggleBlockUser(3)"><i class="fas fa-ban"></i></button>
                         </div>
                     </td>
                 </tr>
             </tbody>
         </table>
     </div>
 </div>

    <script src="script.js"></script>
</body>
</html>
