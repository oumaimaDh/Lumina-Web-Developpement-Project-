<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publier une Offre d'Emploi - Lumina</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Light Theme - Snowy Twilight Palette */
            --bg: #D3D3DF;
            --text: #575D7F;
            --card-bg: #ffffff;
            --border: #211b1c;
            --primary: #7B8AB6;
            --secondary: #A09EBB;
            --accent: #575D7F;
            --gradient: linear-gradient(135deg, #7B8AB6, #A09EBB);
            --footer-bg: #575D7F;
            --form-bg: #ffffff;
            --shadow: rgba(0, 0, 0, 0.05);
            --btn-outline-color: #7B8AB6;
        }

        [data-theme="dark"] {
            /* Dark Theme */
            --bg: #2c3e50;
            --text: #f0f0f0;
            --card-bg: #34495e;
            --border: #444;
            --primary: #7B8AB6;
            --secondary: #A09EBB;
            --accent: #575D7F;
            --gradient: linear-gradient(135deg, #7B8AB6, #A09EBB);
            --footer-bg: #16213e;
            --form-bg: #252536;
            --shadow: rgba(0, 0, 0, 0.2);
            --btn-outline-color: #7B8AB6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        .progress-container {
  max-width: 800px;
  margin: 2rem auto 3rem;
  padding: 0 2rem;
}

.progress-bar {
  display: flex;
  justify-content: space-between;
  position: relative;
  align-items: flex-start;
  gap: 1rem;
}

/* Full-width background line */
.progress-bar::before {
  content: '';
  position: absolute;
  top: 20px;
  left: 0;
  width: 100%;
  height: 4px;
  background: var(--border);
  z-index: 1;
}

/* Animated fill */
.progress-fill {
  position: absolute;
  top: 20px;
  left: 0;
  height: 4px;
  background: var(--primary);
  z-index: 2;
  transition: width 0.4s ease;
  width: 0%;
}

/* Step container */
.step {
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  z-index: 3;
  text-align: center;
  flex: 1;
  min-width: 120px;
}

.step-indicator {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: bold;
  margin-bottom: 10px;
  transition: all 0.3s;
}

.step-indicator.active {
  background: var(--primary);
  color: white;
  transform: scale(1.1);
}

.step-label {
  font-size: 0.85rem;
  color: var(--text);
  line-height: 1.3;
}
        /* Form Section */
        .form-container {
            padding: 2rem;
            background: var(--bg);
        }

        .form-wrapper {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 15px;
            padding: 2.5rem;
            box-shadow: 0 10px 30px var(--shadow);
            border: 1px solid var(--border);
            position: relative;
        }

        .form-step {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .form-step.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-section-title {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-row {
            display: flex;
            gap: 2rem;
            margin-bottom: 1.5rem;
        }

        .form-col {
            flex: 1;
        }

        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text);
            display: flex;
            align-items: center;
        }

        .form-label i {
            margin-right: 8px;
            color: var(--primary);
            width: 20px;
        }

        .form-input {
            width: 100%;
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--card-bg);
            color: var(--text);
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(123, 138, 182, 0.2);
        }

        .form-textarea {
            min-height: 120px;
            resize: vertical;
        }

        .form-select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 16px;
        }

        /* Navigation Buttons */
        .form-footer {
            display: flex;
            justify-content: space-between;
            margin-top: 2rem;
        }

        .btn-nav {
            padding: 0.8rem 1.8rem;
            border-radius: 50px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-prev {
            background: #f0f0f0;
            color: var(--text);
        }

        .btn-next, .btn-submit {
            background: var(--gradient);
            color: white;
        }

        .btn-nav:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .btn-prev:hover {
            background: #e0e0e0;
        }

        /* Confirmation Step */
        .confirmation-step {
            text-align: center;
            padding: 2rem 1rem;
        }

        .confirmation-icon {
            font-size: 4rem;
            color: var(--primary);
            margin-bottom: 1.5rem;
        }

        .confirmation-title {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            color: var(--text);
        }

        .confirmation-text {
            color: #666;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        /* Back to Home Button */
        .back-to-home {
            display: block;
            max-width: 800px;
            margin: 1.5rem auto 0;
            text-align: center;
        }

        .btn-home {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 0.7rem 1.5rem;
            border-radius: 50px;
            font-weight: 500;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-home:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
                gap: 1rem;
            }
            .progress-bar {
                flex-wrap: wrap;
                gap: 20px;
            }
            .progress-bar::before {
                display: none;
            }
            .step-label {
                top: 60px;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <!-- Back to Home Button -->
    <div class="back-to-home">
        <a href="job.html" class="btn-home"><i class="fas fa-arrow-left"></i> Retour à l'accueil</a>
    </div>

    <!-- Progress Bar -->
 <div class="progress-container">
  <div class="progress-bar">
    <div class="step">
      <div class="step-indicator active" id="step-1">1</div>
      <div class="step-label">Espace<br>Entreprise</div>
    </div>
    <div class="step">
      <div class="step-indicator" id="step-2">2</div>
      <div class="step-label">Informations<br>de l'Offre</div>
    </div>
    <div class="step">
      <div class="step-indicator" id="step-3">3</div>
      <div class="step-label">Confirmation</div>
    </div>
    <div class="progress-fill" id="progress-fill"></div>
  </div>
 </div>

    <!-- Multi-step Form -->
    <section class="form-container">
        <div class="form-wrapper">
            <form id="job-offer-form">
                <!-- ÉTAPE 1: Espace Entreprise -->
                <div class="form-step active" id="step1">
                    <h2 class="form-section-title"><i class="fas fa-building"></i> Espace Entreprises</h2>
                    <div class="form-group">
                        <label class="form-label" for="company-name"><i class="fas fa-signature"></i> Raison sociale</label>
                        <input type="text" id="company-name" class="form-input" placeholder="Nom de l'entreprise" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="company-email"><i class="fas fa-envelope"></i> Email professionnel</label>
                        <input type="email" id="company-email" class="form-input" placeholder="contact@entreprise.tn" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="company-phone"><i class="fas fa-phone"></i> Téléphone</label>
                        <input type="tel" id="company-phone" class="form-input" placeholder="+216 XX XXX XXX" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="company-address"><i class="fas fa-map-marker-alt"></i> Adresse</label>
                        <input type="text" id="company-address" class="form-input" placeholder="Avenue Habib Bourguiba, Tunis" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="tax-number"><i class="fas fa-file-invoice"></i> Numéro d'identifiant fiscal (NIF)</label>
                        <input type="text" id="tax-number" class="form-input" placeholder="Ex: 1234567L" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="company-description"><i class="fas fa-align-left"></i> Description de l'entreprise</label>
                        <textarea id="company-description" class="form-input form-textarea" placeholder="Présentez votre entreprise..." rows="4" required></textarea>
                    </div>
                </div>

                <!-- ÉTAPE 2: Informations de l'Offre -->
                <div class="form-step" id="step2">
                    <h2 class="form-section-title"><i class="fas fa-briefcase"></i> Informations de l'Offre</h2>
                    <div class="form-row">
                        <div class="form-col">
                            <div class="form-group">
                                <label class="form-label" for="offer-title"><i class="fas fa-heading"></i> Titre de l'offre</label>
                                <input type="text" id="offer-title" class="form-input" placeholder="Ex: Développeur Web Full Stack" required>
                            </div>
                        </div>
                        <div class="form-col">
                            <div class="form-group">
                                <label class="form-label" for="profession"><i class="fas fa-briefcase"></i> Profession</label>
                                <input type="text" id="profession" class="form-input" placeholder="Ex: Développeur, Designer..." required>
                            </div>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-col">
                            <div class="form-group">
                                <label class="form-label" for="salary"><i class="fas fa-money-bill-wave"></i> Salaire (en DT)</label>
                                <input type="number" id="salary" class="form-input" placeholder="Ex: 1500" min="0" required>
                            </div>
                        </div>
                        <div class="form-col">
                            <div class="form-group">
                                <label class="form-label" for="location"><i class="fas fa-map-marker-alt"></i> Localisation</label>
                                <input type="text" id="location" class="form-input" placeholder="Ex: Tunis, Sousse, Remote" required>
                            </div>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-col">
                            <div class="form-group">
                                <label class="form-label" for="contract-type"><i class="fas fa-file-contract"></i> Type de contrat</label>
                                <select id="contract-type" class="form-input form-select" required>
                                    <option value="">Sélectionnez...</option>
                                    <option value="CDI">CDI</option>
                                    <option value="CDD">CDD</option>
                                    <option value="Stage">Stage</option>
                                    <option value="Freelance">Freelance</option>
                                    <option value="Alternance">Alternance</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-col">
                            <div class="form-group">
                                <label class="form-label" for="status"><i class="fas fa-flag"></i> Statut</label>
                                <select id="status" class="form-input form-select" required>
                                    <option value="">Sélectionnez...</option>
                                    <option value="Pending">En attente de validation</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="required-skills"><i class="fas fa-laptop-code"></i> Compétences requises</label>
                        <textarea id="required-skills" class="form-input form-textarea" placeholder="Séparées par des virgules..." required></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="offer-description"><i class="fas fa-align-left"></i> Description de l'offre</label>
                        <textarea id="offer-description" class="form-input form-textarea" placeholder="Décrivez le poste, responsabilités, avantages..." rows="6" required></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-col">
                            <div class="form-group">
                                <label class="form-label" for="created-date"><i class="fas fa-calendar-plus"></i> Date de création</label>
                                <input type="date" id="created-date" class="form-input" required>
                            </div>
                        </div>
                        <div class="form-col">
                            <div class="form-group">
                                <label class="form-label" for="expiration-date"><i class="fas fa-calendar-times"></i> Date d'expiration</label>
                                <input type="date" id="expiration-date" class="form-input" required>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ÉTAPE 3: Confirmation -->
                <div class="form-step" id="step3">
                    <div class="confirmation-step">
                        <div class="confirmation-icon">
                            <i class="fas fa-check-circle"></i>
                        </div>
                        <h3 class="confirmation-title">Prêt à publier ?</h3>
                        <p class="confirmation-text">
                            Votre offre d'emploi sera soumise à nos administrateurs pour validation.<br>
                            Une fois approuvée, elle sera visible par les candidats qualifiés.
                        </p>
                    </div>
                </div>

                <!-- Navigation -->
                <div class="form-footer">
                    <button type="button" id="prevBtn" class="btn-nav btn-prev" style="display:none;">
                        <i class="fas fa-arrow-left"></i> Précédent
                    </button>
                    <button type="button" id="nextBtn" class="btn-nav btn-next">
                        Suivant <i class="fas fa-arrow-right"></i>
                    </button>
                    <button type="submit" id="submitBtn" class="btn-nav btn-submit" style="display:none;">
                        <i class="fas fa-paper-plane"></i> Publier l'offre
                    </button>
                </div>
            </form>
        </div>
    </section>

    <script>
        let currentStep = 1;
        const totalSteps = 3;
        const formSteps = document.querySelectorAll('.form-step');
        const nextBtn = document.getElementById('nextBtn');
        const prevBtn = document.getElementById('prevBtn');
        const submitBtn = document.getElementById('submitBtn');
        const progressFill = document.getElementById('progress-fill');

        // Mise à jour de la barre de progression
        function updateProgress() {
            const percent = ((currentStep - 1) / (totalSteps - 1)) * 100;
            progressFill.style.width = `${percent}%`;

            // Mise à jour des indicateurs
            document.querySelectorAll('.step-indicator').forEach((el, i) => {
                if (i + 1 <= currentStep) {
                    el.classList.add('active');
                } else {
                    el.classList.remove('active');
                }
            });

            // Afficher/masquer les boutons
            if (currentStep === 1) {
                prevBtn.style.display = 'none';
            } else {
                prevBtn.style.display = 'flex';
            }

            if (currentStep === totalSteps) {
                nextBtn.style.display = 'none';
                submitBtn.style.display = 'flex';
            } else {
                nextBtn.style.display = 'flex';
                submitBtn.style.display = 'none';
            }
        }

        // Navigation
        nextBtn.addEventListener('click', () => {
            if (currentStep < totalSteps) {
                formSteps[currentStep - 1].classList.remove('active');
                currentStep++;
                formSteps[currentStep - 1].classList.add('active');
                updateProgress();
            }
        });

        prevBtn.addEventListener('click', () => {
            if (currentStep > 1) {
                formSteps[currentStep - 1].classList.remove('active');
                currentStep--;
                formSteps[currentStep - 1].classList.add('active');
                updateProgress();
            }
        });

        // Soumission
        document.getElementById('job-offer-form').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('✅ Offre soumise avec succès !\nElle sera examinée par nos administrateurs.');
            // Ici, vous pouvez ajouter un appel API ou rediriger
        });

        // Initialisation
        updateProgress();
    </script>

    
</body>
</html>
