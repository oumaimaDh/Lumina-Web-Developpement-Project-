<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Edit User</title>
  <link rel="stylesheet" href="admin.css" />
</head>
<body>

  <!-- Toggle Button -->
  <button class="toggle-btn" onclick="toggleSidebar()">☰</button>

   <!-- Sidebar -->
   <div class="sidebar" id="sidebar">
    <a href="homepage.html">Home</a>
    <a href="Manage.html">Users</a>
    <a href="Charts.html">Reports</a>

    <!-- Dropdown -->
    <div class="dropdown">
        <a class="dropdown-btn">Departments </a>
        <div class="dropdown-container">
            <a href="Requests.html">Associations</a>
            <a href="#">Jobs</a>
            <a href="#">Events</a>
            <a href="#">Reviews & Complaints</a>
        </div>
    </div>

    <a href="Admin.html">Profile Settings</a>
</div>
  <div class="main-content">
    <h1>Edit User</h1>

    <form id="editUserForm">
      <label for="userId">User ID</label>
      <input type="text" id="userId" readonly />

      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Enter username" />

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter email" />

      <label for="role">Role</label>
      <select id="role">
        <option>Help Seekr</option>
        <option>Association</option>
        <option>Volunteer</option>
      </select>

      <button type="submit">Save Changes</button>
    </form>
  </div>

  <script>
    // Sidebar toggle
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
    }

    // Fill the form dynamically from URL
    const params = new URLSearchParams(window.location.search);
    const userId = params.get('id');

    if (userId) {
      document.getElementById('userId').value = userId;
      // 🧠 Example only: here you can later fetch user data from backend or local data
      document.getElementById('username').value = "JohnDoe";
      document.getElementById('email').value = "john@example.com";
      document.getElementById('role').value = "User";
    }

    // Handle form submit
    document.getElementById('editUserForm').addEventListener('submit', function (e) {
      e.preventDefault();
      alert('User updated successfully!');
      window.location.href = "Manage.html"; // Redirect back to Manage Users
    });
  </script>
</body>
</html>
