<!-- Edit-User.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit User</title>
  <link rel="stylesheet" href="edit.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Toggle Button -->
 <button class="toggle-btn" onclick="toggleSidebar()">☰</button>

 <!-- Sidebar -->
 <div class="sidebar" id="sidebar">
     <a href="homepage.html"  ><i class="fas fa-home"></i> Home</a>
     <a href="Manage.html"><i class="fas fa-users"></i> Users</a>
     <a href="Charts.html"><i class="fas fa-chart-bar"></i> Reports</a>

     <!-- Dropdown -->
     <div class="dropdown">
         <a class="dropdown-btn"  class="active"><i class="fas fa-building"></i> Departments</a>
         <div class="dropdown-container">
             <a href="Requests.html" ><i class="fas fa-handshake"></i> Associations</a>
             <a href="#"  ><i class="fas fa-briefcase"></i> Jobs</a>
             <a href="#"><i class="fas fa-calendar-alt"></i> Events</a>
             <a href="#" ><i class="fas fa-comments"></i> Reviews & Complaints</a>
         </div>
     </div>

     <a href="Admin.html" ><i class="fas fa-user-cog"></i> Profile Settings</a>
 </div>



  <div class="main-content">
    <div class="page-header">
      <h1><i class="fas fa-user-edit"></i> Edit User</h1>
      <p>Update user information and permissions</p>
    </div>

    <div class="form-container">
      <form id="editUserForm">
        <div class="form-section">
          <h3><i class="fas fa-id-card"></i> Basic Information</h3>
          
          <div class="form-group">
            <label for="userId">User ID</label>
            <input type="text" id="userId" readonly class="readonly-field" />
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <label for="username">Username <span class="required">*</span></label>
              <input type="text" id="username" placeholder="Enter username" required />
            </div>
            
            <div class="form-group">
              <label for="fullName">Full Name</label>
              <input type="text" id="fullName" placeholder="Enter full name" />
            </div>
          </div>
          
          <div class="form-group">
            <label for="email">Email Address <span class="required">*</span></label>
            <input type="email" id="email" placeholder="Enter email address" required />
          </div>
        </div> <!-- Close Basic Information section -->
        
        <div class="form-section">
          <h3><i class="fas fa-user-tag"></i> Account Settings</h3>
          
          <div class="form-row">
            <div class="form-group">
              <label for="role">User Role <span class="required">*</span></label>
              <select id="role" required>
                <option value="">Select a role</option>
                <option value="Help Seeker">Help Seeker</option>
                <option value="Association">Association</option>
                <option value="Volunteer">Volunteer</option>
              </select>
            </div>
            
            <div class="form-group">
              <label for="status">Account Status <span class="required">*</span></label>
              <select id="status" required>
                <option value="">Select status</option>
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
                <option value="Suspended">Suspended</option>
                <option value="Pending">Pending Verification</option>
              </select>
            </div>
          </div>
        </div> <!-- Close Account Settings section -->
        
        <div class="form-actions">
          <button type="button" class="btn-secondary" onclick="window.location.href='Manage.html'">
            <i class="fas fa-arrow-left"></i> Back to Users
          </button>
          
          <div class="action-buttons-group">
            <button type="button" class="btn-danger" id="resetBtn">
              <i class="fas fa-undo"></i> Reset
            </button>
            <button type="submit" class="btn-primary">
              <i class="fas fa-save"></i> Save Changes
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
  </div>

  <!-- Success Modal -->
  <div class="modal" id="successModal">
    <div class="modal-content">
      <div class="modal-icon success">
        <i class="fas fa-check-circle"></i>
      </div>
      <h2>Success!</h2>
      <p>User information has been updated successfully.</p>
      <div class="modal-actions">
        <button class="btn-primary" onclick="closeSuccessModal()">Continue</button>
      </div>
    </div>
  </div>

  <script src="edit.js"></script>

</body>
</html>
