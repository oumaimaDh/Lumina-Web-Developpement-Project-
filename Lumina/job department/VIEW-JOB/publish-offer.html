<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publish a Job Offer - Lumina</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <!-- Link to the external CSS file -->
    <link rel="stylesheet" href="CSS/publish-offer.css">
</head>
<body>
    <!-- Back to Home Button-->
    <div class="back-to-home">
        <a href="job.html" class="btn-home"><i class="fas fa-arrow-left"></i> Back to Home</a>
    </div>
        <!-- Animated Face and Speech Bubble -->
    <div class="assistant-container">
        <div class="speech-bubble" id="speech-bubble">
            Ready to post your job offer? Let's get started! 🚀
        </div>
        <div class="animated-face" id="animated-face">
            <div class="face-inner">
                <div class="eyes">
                    <div class="eye"></div>
                    <div class="eye"></div>
                </div>
                <div class="mouth"></div>
            </div>
        </div>
    </div>

    <!-- Progress Bar-->
    <div class="progress-container">
        <div class="progress-bar">
            <div class="step">
                <div class="step-indicator active" id="step-1">1</div>
                <div class="step-label">Company<br>Space</div>
            </div>
            <div class="step">
                <div class="step-indicator" id="step-2">2</div>
                <div class="step-label">Job<br>Information</div>
            </div>
            <div class="step">
                <div class="step-indicator" id="step-3">3</div>
                <div class="step-label">Confirmation</div>
            </div>
            <div class="progress-fill" id="progress-fill"></div>
        </div>
    </div>

    <!-- Multi-step Form-->
    <section class="form-container">
        <div class="form-wrapper">
            <form id="job-offer-form">
                <!-- STEP 1: Company Space-->
                <div class="form-step active" id="step1">
                    <h2 class="form-section-title"><i class="fas fa-building"></i> Company Space</h2>
                    <div class="form-group">
                        <label class="form-label" for="company-name"><i class="fas fa-signature"></i> Company Name</label>
                        <input type="text" id="company-name" class="form-input" placeholder="Company name" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="company-email"><i class="fas fa-envelope"></i> Professional Email</label>
                        <input type="email" id="company-email" class="form-input" placeholder="contact@company.tn" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="company-phone"><i class="fas fa-phone"></i> Phone</label>
                        <input type="tel" id="company-phone" class="form-input" placeholder="+216 XX XXX XXX" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="company-address"><i class="fas fa-map-marker-alt"></i> Address</label>
                        <input type="text" id="company-address" class="form-input" placeholder="Avenue Habib Bourguiba, Tunis" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="tax-number"><i class="fas fa-file-invoice"></i> Tax Identification Number (TIN)</label>
                        <input type="text" id="tax-number" class="form-input" placeholder="Ex: 1234567L" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="company-description"><i class="fas fa-align-left"></i> Company Description</label>
                        <textarea id="company-description" class="form-input form-textarea" placeholder="Present your company..." rows="4" required></textarea>
                    </div>
                </div>

                <!-- STEP 2: Job Information-->
                <div class="form-step" id="step2">
                    <h2 class="form-section-title"><i class="fas fa-briefcase"></i> Job Information</h2>
                    <div class="form-row">
                        <div class="form-col">
                            <div class="form-group">
                                <label class="form-label" for="offer-title"><i class="fas fa-heading"></i> Job Title</label>
                                <input type="text" id="offer-title" class="form-input" placeholder="Ex: Full Stack Web Developer" required>
                            </div>
                        </div>
                        <div class="form-col">
                            <div class="form-group">
                                <label class="form-label" for="profession"><i class="fas fa-briefcase"></i> Profession</label>
                                <input type="text" id="profession" class="form-input" placeholder="Ex: Developer, Designer..." required>
                            </div>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-col">
                            <div class="form-group">
                                <label class="form-label" for="salary"><i class="fas fa-money-bill-wave"></i> Salary (in DT)</label>
                                <input type="number" id="salary" class="form-input" placeholder="Ex: 1500" min="0" required>
                            </div>
                        </div>
                        <div class="form-col">
                            <div class="form-group">
                                <label class="form-label" for="location"><i class="fas fa-map-marker-alt"></i> Location</label>
                                <input type="text" id="location" class="form-input" placeholder="Ex: Tunis, Sousse, Remote" required>
                            </div>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-col">
                            <div class="form-group">
                                <label class="form-label" for="contract-type"><i class="fas fa-file-contract"></i> Contract Type</label>
                                <select id="contract-type" class="form-input form-select" required>
                                    <option value="">Select...</option>
                                    <option value="Permanent">Permanent</option>
                                    <option value="Fixed-term">Fixed-term</option>
                                    <option value="Internship">Internship</option>
                                    <option value="Freelance">Freelance</option>
                                    <option value="Apprenticeship">Apprenticeship</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-col">
                            <div class="form-group">
                                <label class="form-label" for="status"><i class="fas fa-flag"></i> Status</label>
                                <select id="status" class="form-input form-select" required>
                                    <option value="">Select...</option>
                                    <option value="Pending">Pending validation</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="required-skills"><i class="fas fa-laptop-code"></i> Required Skills</label>
                        <textarea id="required-skills" class="form-input form-textarea" placeholder="Separated by commas..." required></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="offer-description"><i class="fas fa-align-left"></i> Job Description</label>
                        <textarea id="offer-description" class="form-input form-textarea" placeholder="Describe the position, responsibilities, benefits..." rows="6" required></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-col">
                            <div class="form-group">
                                <label class="form-label" for="created-date"><i class="fas fa-calendar-plus"></i> Creation Date</label>
                                <input type="date" id="created-date" class="form-input" required>
                            </div>
                        </div>
                        <div class="form-col">
                            <div class="form-group">
                                <label class="form-label" for="expiration-date"><i class="fas fa-calendar-times"></i> Expiration Date</label>
                                <input type="date" id="expiration-date" class="form-input" required>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- STEP 3: Confirmation-->
                <div class="form-step" id="step3">
                    <div class="confirmation-step">
                        <div class="confirmation-icon">
                            <i class="fas fa-check-circle"></i>
                        </div>
                        <h3 class="confirmation-title">Ready to Publish?</h3>
                        <p class="confirmation-text">
                            Your job offer will be submitted to our administrators for validation.<br>
                            Once approved, it will be visible to qualified candidates.
                        </p>
                    </div>
                </div>

                <!-- Navigation-->
                <div class="form-footer">
                    <button type="button" id="prevBtn" class="btn-nav btn-prev" style="display:none;">
                        <i class="fas fa-arrow-left"></i> Previous
                    </button>
                    <button type="button" id="nextBtn" class="btn-nav btn-next">
                        <i class="fas fa-arrow-right"></i> Next
                    </button>
                    <button type="submit" id="submitBtn" class="btn-nav btn-submit" style="display:none;">
                        <i class="fas fa-paper-plane"></i> Publish Job
                    </button>
                </div>
            </form>
        </div>
    </section>

    <script>
        let currentStep = 1;
        const totalSteps = 3;
        const formSteps = document.querySelectorAll('.form-step');
        const nextBtn = document.getElementById('nextBtn');
        const prevBtn = document.getElementById('prevBtn');
        const submitBtn = document.getElementById('submitBtn');
        const progressFill = document.getElementById('progress-fill');

        // Update progress bar
        function updateProgress() {
            const percent = ((currentStep - 1) / (totalSteps - 1)) * 100;
            progressFill.style.width = `${percent}%`;
            // Update indicators
            document.querySelectorAll('.step-indicator').forEach((el, i) => {
                if (i + 1 <= currentStep) {
                    el.classList.add('active');
                } else {
                    el.classList.remove('active');
                }
            });
            // Show/hide buttons
            if (currentStep === 1) {
                prevBtn.style.display = 'none';
            } else {
                prevBtn.style.display = 'flex';
            }
            if (currentStep === totalSteps) {
                nextBtn.style.display = 'none';
                submitBtn.style.display = 'flex';
            } else {
                nextBtn.style.display = 'flex';
                submitBtn.style.display = 'none';
            }
        }

        // Navigation
        nextBtn.addEventListener('click', () => {
            if (currentStep < totalSteps) {
                formSteps[currentStep - 1].classList.remove('active');
                currentStep++;
                formSteps[currentStep - 1].classList.add('active');
                updateProgress();
            }
        });

        prevBtn.addEventListener('click', () => {
            if (currentStep > 1) {
                formSteps[currentStep - 1].classList.remove('active');
                currentStep--;
                formSteps[currentStep - 1].classList.add('active');
                updateProgress();
            }
        });

        // Submission
        document.getElementById('job-offer-form').addEventListener('submit', function (e) {
            e.preventDefault();
            alert('✅ Job successfully submitted!\nIt will be reviewed by our administrators.');
            // Here you can add an API call or redirect
        });

        // Initialization
        updateProgress();
    </script>
        <script>
        // Cute Face Assistant
        const speechBubble = document.getElementById('speech-bubble');
        const animatedFace = document.getElementById('animated-face');
        
        // Array of cute messages for the assistant
        const cuteMessages = [
            "Ready to post your job offer? Let's get started! 🚀",
            "Great companies need great talent like yours! 💼",
            "Let's find the perfect candidate together! ✨",
            "Your job offer will reach qualified candidates! 📈",
            "Posting jobs has never been easier! 😊",
            "We'll help you find the right fit! 🔍",
            "Your company deserves the best talent! 🌟",
            "Almost done! Your offer looks great! 🎉",
            "Candidates will love working with you! 💖",
            "Your job offer is in good hands! 🤗",
            "Ready to welcome new talent to your team! 🚀",
            "Your recruitment process just got smarter! 📊"
        ];
        
        // Change the speech bubble message every 8 seconds
        let messageIndex = 0;
        function changeMessage() {
            speechBubble.textContent = cuteMessages[messageIndex];
            messageIndex = (messageIndex + 1) % cuteMessages.length;
            
            // Add a subtle animation when changing messages
            speechBubble.style.animation = 'none';
            setTimeout(() => {
                speechBubble.style.animation = 'bubbleFloat 4s ease-in-out infinite';
            }, 10);
        }
        
        // Initial message change
        changeMessage();
        
        // Set interval to change messages
        setInterval(changeMessage, 8000);
        
        // Make the face clickable to immediately change message
        animatedFace.addEventListener('click', changeMessage);
    </script>
</body>
</html>
